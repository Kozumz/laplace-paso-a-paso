# Solo para VPS. Copia a /etc/nginx/sites-available/laplace y cambia tu-dominio.com
# Después: sudo ln -s /etc/nginx/sites-available/laplace /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# HTTPS gratis: sudo certbot --nginx -d laplace.tu-dominio.com

# Portafolio (sitio estático en /var/www/portafolio)
server {
    listen 80;
    server_name tu-dominio.com www.tu-dominio.com;
    root /var/www/portafolio;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

# Laplace (app Node en el puerto 3000)
server {
    listen 80;
    server_name laplace.tu-dominio.com;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
