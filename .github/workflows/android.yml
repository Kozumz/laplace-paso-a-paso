# Compila la APK en los servidores de GitHub cada vez que subes cambios.
# La descargas en: pestaña Actions → la última ejecución → "laplace-apk".
# Si haces un tag (git tag v1.0.0 && git push --tags), además se publica en Releases.
name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Copiar la web a Android
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk laplace-paso-a-paso.apk

      - uses: actions/upload-artifact@v4
        with:
          name: laplace-apk
          path: laplace-paso-a-paso.apk

      - name: Publicar en Releases (solo con tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: laplace-paso-a-paso.apk
